<!doctype html>
<!--
  ใบสั่งงานที่ผู้ให้บริการเปิดจากลิงก์ SMS (LOCATION_RELAY=ntfy) — วางคู่กับ index.html (หน้าส่งตำแหน่ง) บน GitHub Pages
  ลิงก์ = https://<หน้านี้>/w#<กุญแจ>  (ระบบ Roadside สร้างให้ — backend/app/services/work_order_link_service.py)
    ส่วนหลัง # เบราว์เซอร์ไม่ส่งไปที่ server → GitHub / ntfy ไม่เห็นกุญแจ
  ดึงข้อความล่าสุดของ topic จาก ntfy → ถอดรหัส (AES-128-GCM, AAD = topic) → แสดงใบงาน · ไม่บันทึกไฟล์เอง กดปุ่มเมื่อต้องการ PDF
  ข้อความ = { v, exp, wo: { ช่อง: ข้อความ } } หรือ { v, revoked: true } (เปลี่ยนผู้ให้บริการ / ยกเลิกงาน)
  ⚠ NTFY_URL และวิธีคำนวณ topic ต้องตรงกับ backend · Layout ตรงกับ frontend WorkOrderDocument.tsx — แก้ที่หนึ่งให้แก้อีกที่ด้วย
-->
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Falcon Insurance — ใบสั่งงาน</title>
  <style>
    :root { color-scheme: light; --red: #dc2626; --muted: #475569; --primary: #2563eb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #000; font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif; }
    .bar { max-width: 210mm; margin: 0 auto; padding: 16px; display: flex; justify-content: flex-end; gap: 12px; align-items: center; }
    .bar .until { margin-right: auto; font-size: .85rem; color: var(--muted); }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .msg { max-width: 28rem; margin: 0 auto; min-height: 100dvh; display: flex; align-items: center; padding: 16px; font-size: .95rem; color: var(--muted); line-height: 1.5; }
    .err { color: var(--red); font-size: .85rem; }
    [hidden] { display: none !important; }

    /* ใบงาน — ตาม WorkOrderDocument.tsx */
    .wo { max-width: 210mm; margin: 0 auto; background: #fff; color: #000; line-height: 1.625; padding: 40px; font-size: 17px;
          font-family: "Times New Roman", "Angsana New", "TH Sarabun New", serif; }
    .wo img { height: 48px; width: auto; display: block; }
    .wo h1 { margin: 40px 0 24px; text-align: center; font-size: 19px; font-weight: 400; }
    .wo p { margin: 0; }
    .stack > * + * { margin-top: 12px; }
    .red { color: var(--red); }
    .r2, .r3 { display: grid; column-gap: 24px; }
    .r2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .r3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .span2 { grid-column: span 2; }
    .service { margin-left: 48px; }
    /* หน้าบนมือถือ: จอแคบเรียงช่องเป็นแถวเดียว */
    .wo.responsive { padding: 16px; font-size: 15px; }
    .wo.responsive .r2, .wo.responsive .r3 { grid-template-columns: minmax(0, 1fr); row-gap: 12px; }
    .wo.responsive .span2 { grid-column: auto; }
    @media (min-width: 640px) {
      .wo.responsive { padding: 40px; font-size: 17px; }
      .wo.responsive .r2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .wo.responsive .r3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .wo.responsive .span2 { grid-column: span 2; }
    }
    /* สำเนาขนาด A4 ที่มองไม่เห็น ใช้ถ่ายลง PDF ให้ได้รูปแบบเดิมไม่ว่าเปิดจากจอไหน */
    .capture { position: fixed; top: 0; left: -10000px; width: 794px; }
    @media print { .bar, .capture { display: none !important; } .wo { padding: 0; } }
  </style>
</head>
<body>
  <p id="msg" class="msg">กำลังเปิดใบสั่งงาน…</p>
  <div id="page" hidden>
    <div class="bar">
      <span id="until" class="until"></span>
      <span id="pdfError" class="err" hidden>บันทึก PDF ไม่สำเร็จ กรุณาลองอีกครั้ง</span>
      <button id="pdf" type="button">บันทึกเป็น PDF</button>
    </div>
    <div id="view" class="wo responsive"></div>
    <div class="capture" aria-hidden="true"><div id="capture" class="wo"></div></div>
  </div>

  <script>
    "use strict";
    // ต้องตรงกับ NTFY_URL ใน backend/.env
    const NTFY_URL = "https://ntfy.sh";
    const LIBS = [
      { src: "https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js", sri: "sha384-Tha/42qsYmpYmQ07pX+nJzkKumO0BzKJxK/uzVc7xyBQxVCUgQBhQIG8L7vXK+9C" },
      { src: "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js", sri: "sha384-qovJwSBbRDPP5cEjCp8S0UP66wrvnjaa60XMOGzTNanrThcrGfXfnZkvgY8N1KT3" },
    ];
    const A4 = { width: 210, height: 297 }; // มม.

    const TEXT = {
      invalid: "ลิงก์นี้หมดอายุหรือใช้งานไม่ได้ กรุณาติดต่อเจ้าหน้าที่",
      unavailable: "เปิดใบสั่งงานไม่ได้ในขณะนี้ กรุณาลองใหม่อีกครั้ง หรือติดต่อเจ้าหน้าที่",
      unsupported: "เบราว์เซอร์นี้เปิดใบสั่งงานไม่ได้ กรุณาเปิดลิงก์ด้วย Chrome หรือ Safari",
      saving: "กำลังสร้าง PDF…",
      save: "บันทึกเป็น PDF",
    };

    const $ = (id) => document.getElementById(id);
    const showMsg = (text) => { $("msg").textContent = text; $("msg").hidden = false; $("page").hidden = true; };

    function b64url(bytes) {
      let s = "";
      bytes.forEach((b) => { s += String.fromCharCode(b); });
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function b64urlDecode(text) {
      const s = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (text.length % 4)) % 4));
      return Uint8Array.from(s, (c) => c.charCodeAt(0));
    }

    // topic = "fl" + base64url(SHA-256("topic|" + กุญแจ base64url) 16 byte แรก) — ตรงกับ _relay_topic() ฝั่ง backend
    async function topicFor(keyText) {
      const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("topic|" + keyText)));
      return "fl" + b64url(digest.slice(0, 16));
    }

    // ถอดได้ = ข้อความจริงจากระบบ · byte แรก 0x01 = บีบอัด (deflate-raw) · ถอดไม่ได้ / ปลอม = null
    async function decrypt(key, topic, message) {
      try {
        const raw = b64urlDecode(message.trim());
        let data = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12), additionalData: new TextEncoder().encode(topic) }, key, raw.slice(12)));
        if (data[0] === 1) {
          const stream = new Blob([data.slice(1)]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
          data = new Uint8Array(await new Response(stream).arrayBuffer());
        }
        return JSON.parse(new TextDecoder().decode(data));
      } catch {
        return null;
      }
    }

    // ข้อความล่าสุดที่ถอดได้ = สถานะปัจจุบันของลิงก์ (ส่งซ้ำ = ข้อมูลใหม่ · ยกเลิก = revoked)
    async function latest(key, topic) {
      const res = await fetch(`${NTFY_URL}/${topic}/json?poll=1&since=all`, { cache: "no-store" });
      if (!res.ok) throw new Error(String(res.status));
      let found = null;
      for (const line of (await res.text()).split("\n")) {
        if (!line.trim()) continue;
        const event = JSON.parse(line);
        if (event.event !== "message" || typeof event.message !== "string") continue;
        const payload = await decrypt(key, topic, event.message);
        if (payload && typeof payload === "object") found = payload;
      }
      return found;
    }

    // ---------- ใบงาน (ตาม WorkOrderDocument.tsx) ----------
    const F = (label, id, red) => ({ label, id, red });
    const LAYOUT = [
      ["r2", F("เลขที่เลขอ้างอิง Roadside", "ref", true), F("วันเวลารับเรื่อง", "created")],
      F("ประเภทกรมธรรม์", "ptype"),
      F("ชื่อ-นามสกุล ผู้ถือกรมธรรม์", "insured"),
      F("กรมธรรม์เลขที่", "policyNo"),
      ["r2", F("วันที่เริ่มต้นคุ้มครอง กรมธรรม์", "start"), F("วันที่สิ้นสุดการคุ้มครอง", "end")],
      ["r3", F("เลขตัวถัง", "chassis"), { ...F("ประเภทรถ", "vtype"), span2: true }],
      ["r3", F("ทะเบียนรถ", "plate"), F("จังหวัด", "plateProv")],
      ["r3", F("ยี่ห้อ", "brand"), F("รุ่น", "model"), F("เกรดการซ่อม", "repair")],
      ["r2", F("ชื่อผู้ขอใช้บริการ", "informer"), F("เบอร์โทรศัพท์ผู้ขอใช้บริการ", "informerPhone")],
      ["r2", F("ชื่อผู้ขับขี่", "driver"), F("เบอร์โทรศัพท์ผู้ขับขี่", "driverPhone")],
      "service",
      "terms",
      F("สาเหตุการขอใช้บริการ", "cause"),
      F("วันและเวลาที่เกิดเหตุ", "lossAt"),
      F("สถานที่เกิดเหตุ", "lossPlace"),
      F("วัน เวลาที่นัดหมาย", "apptAt"),
      F("สถานที่นัดหมาย", "apptPlace"),
      F("การเกิดเหตุเบื้องต้น", "remark"),
      F("ปลายทาง", "dest"),
      F("ชื่อผู้รับเรื่อง", "receiver"),
    ];
    const TERMS = [
      "รถยนต์สันดาป บริการฟรีในระยะทาง 35 กม. นับจากจุดเกิดเหตุไปยังปลายทาง",
      "หากระยะทางเกินลูกค้ารับผิดชอบกม.ละ 25 บาท",
      "รถยนต์ไฟฟ้า (EV) บริการฟรีในระยะทาง 35 กม. นับจากจุดที่ผู้ให้บริการไปยังจุดเกิดเหตุ",
      "หากระยะทางเกินลูกค้ารับผิดชอบกม.ละ 30 บาท",
    ];

    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    // ข้อมูลส่วนบุคคลใส่ด้วย textContent เท่านั้น (ไม่ใช้ innerHTML)
    function field(f, wo) {
      const p = el("p", f.span2 ? "span2" : "", `${f.label}: `);
      p.append(el("span", f.red ? "red" : "", wo[f.id] || "-"));
      return p;
    }

    function render(target, wo) {
      target.replaceChildren();
      const logo = el("img");
      logo.src = "falcon-logo.png";
      logo.alt = "Falcon Insurance";
      target.append(logo, el("h1", "", "รายละเอียดข้อมูลการรับเรื่องขอใช้บริการช่วยเหลือฉุกเฉินบนท้องถนน 24 ชม."));
      const stack = el("div", "stack");
      for (const item of LAYOUT) {
        if (Array.isArray(item)) {
          const row = el("div", item[0]);
          item.slice(1).forEach((f) => row.append(field(f, wo)));
          stack.append(row);
        } else if (item === "service") {
          const p = el("p", "", "ประเภทการใช้บริการ:");
          p.append(el("span", "red service", wo.service || "-"));
          stack.append(p);
        } else if (item === "terms") {
          const box = el("div", "stack red");
          TERMS.forEach((t) => box.append(el("p", "", t)));
          stack.append(box);
        } else {
          stack.append(field(item, wo));
        }
      }
      target.append(stack);
    }

    function loadScript({ src, sri }) {
      return new Promise((resolve, reject) => {
        if (document.querySelector(`script[src="${src}"]`)) return resolve();
        const s = document.createElement("script");
        s.src = src;
        s.integrity = sri;
        s.crossOrigin = "anonymous";
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    // ถ่ายภาพสำเนา A4 → PDF หน้าเดียว (ยาวเกินย่อให้พอดี) — แบบเดียวกับ work-order-pdf.ts
    async function savePdf(refNo) {
      for (const lib of LIBS) await loadScript(lib);
      const page = $("capture");
      await document.fonts.ready;
      const png = await window.htmlToImage.toPng(page, { pixelRatio: 2, backgroundColor: "#ffffff" });
      const ratio = page.scrollHeight / page.scrollWidth;
      const width = Math.min(A4.width, A4.height / ratio);
      const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      pdf.addImage(png, "PNG", (A4.width - width) / 2, 0, width, width * ratio);
      pdf.save(`ใบงาน ${refNo}.pdf`);
    }

    async function start() {
      const keyText = location.hash.slice(1);
      if (!keyText) return showMsg(TEXT.invalid);
      if (!window.isSecureContext || !crypto.subtle || typeof DecompressionStream === "undefined") return showMsg(TEXT.unsupported);
      let key, topic, payload;
      try {
        key = await crypto.subtle.importKey("raw", b64urlDecode(keyText), "AES-GCM", false, ["decrypt"]);
        topic = await topicFor(keyText);
      } catch {
        return showMsg(TEXT.invalid);
      }
      try {
        payload = await latest(key, topic);
      } catch {
        return showMsg(TEXT.unavailable);
      }
      if (!payload || payload.revoked || !payload.wo || !(payload.exp * 1000 > Date.now())) return showMsg(TEXT.invalid);

      const wo = payload.wo;
      render($("view"), wo);
      render($("capture"), wo);
      const until = new Date(payload.exp * 1000).toLocaleString("th-TH", { dateStyle: "short", timeStyle: "short", timeZone: "Asia/Bangkok" });
      $("until").textContent = `ลิงก์ใช้ได้ถึง ${until}`;
      $("msg").hidden = true;
      $("page").hidden = false;

      $("pdf").addEventListener("click", async () => {
        const btn = $("pdf");
        btn.disabled = true;
        btn.textContent = TEXT.saving;
        $("pdfError").hidden = true;
        try {
          await savePdf(wo.ref || "");
        } catch {
          $("pdfError").hidden = false;
        } finally {
          btn.disabled = false;
          btn.textContent = TEXT.save;
        }
      });
    }

    start();
  </script>
</body>
</html>
